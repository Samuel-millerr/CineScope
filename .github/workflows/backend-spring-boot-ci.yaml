name: CineScope Backend Spring Boot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend/spring-boot

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Criar arquivo .env para CI
        run: |
          cat > .env <<EOF
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_NAME=cinescope
          DATABASE_USERNAME=postgres
          DATABASE_PASSWORD=root
          EOF

      - name: Iniciar PostgreSQL
        run: |
          docker compose up -d --wait postgres
          docker compose logs postgres

      - name: Executar testes e build
        run: ./mvnw --batch-mode verify

      - name: Encerrar infraestrutura
        if: always()
        run: docker compose down -v
